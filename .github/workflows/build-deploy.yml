name: Build and Deploy

# data/ の更新は batch.yml が ingest→build→deploy を一気通貫で行うため、
# ここでは site/ のコード変更と手動実行のみをトリガーにする。
on:
  push:
    paths:
      - 'site/**'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kokkai-transcriber/pyproject.toml

      - name: Install search-index dependencies
        run: pip install sudachipy sudachidict-core

      - name: Build search index
        working-directory: kokkai-transcriber
        run: python -m src.build_search_index

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Validate data referential integrity (non-blocking until reprocess)
        working-directory: site
        continue-on-error: true
        run: npm run validate:data

      - name: Run vitest
        working-directory: site
        run: npm run test

      - name: Build Astro site (includes Pagefind via postbuild)
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
