name: Batch ingest sessions

on:
  schedule:
    # 毎時 15 分に起動。
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: '開始日 (YYYY-MM-DD)。省略時は7日前'
        required: false
        default: ''
      chamber:
        description: '対象の院 (both / shugiin / sangiin)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - shugiin
          - sangiin

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.probe.outputs.sessions }}
      total: ${{ steps.probe.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kokkai-transcriber/pyproject.toml
      
      - name: Install discovery dependencies
        run: |
          cd kokkai-transcriber
          # 参議院の探索には playwright が必要
          pip install -e '.[browser]'
          python -m playwright install --with-deps chromium

      - name: Resolve dates
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.since }}" ]; then
            SINCE="${{ github.event.inputs.since }}"
          else
            SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"

      - name: Probe for new sessions
        id: probe
        run: |
          CH="${{ github.event.inputs.chamber }}"
          if [ "$CH" = "shugiin" ]; then
            ARGS="--chamber shugiin"
          elif [ "$CH" = "sangiin" ]; then
            ARGS="--chamber sangiin"
          else
            ARGS="--chamber shugiin --chamber sangiin"
          fi
          cd kokkai-transcriber
          JSON=$(python -m src.batch $ARGS --since "${{ steps.dates.outputs.since }}" --dry-run --json)
          echo "sessions=$JSON" >> "$GITHUB_OUTPUT"
          TOTAL=$(echo "$JSON" | jq 'length')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          
          # サマリー出力
          echo "### Discovered Sessions ($TOTAL)" >> $GITHUB_STEP_SUMMARY
          echo "| Chamber | Session ID | Date |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------------|------|" >> $GITHUB_STEP_SUMMARY
          echo "$JSON" | jq -r '.[] | "| \(.chamber) | \(.sid) | \(.date) |"' >> $GITHUB_STEP_SUMMARY

      - name: Refresh laws
        if: steps.probe.outputs.total != '0'
        run: |
          cd kokkai-transcriber
          python -m src.laws_builder --sessions "221"

      - name: Upload laws
        if: steps.probe.outputs.total != '0'
        uses: actions/upload-artifact@v4
        with:
          name: laws-data
          path: data/laws/
          retention-days: 1

  ingest:
    needs: discovery
    if: needs.discovery.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs.discovery.outputs.sessions) }}
    name: ingest (${{ matrix.session.chamber }}-${{ matrix.session.sid }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kokkai-transcriber/pyproject.toml
      
      - name: Download laws
        uses: actions/download-artifact@v4
        with:
          name: laws-data
          path: data/laws/
      
      - name: Install dependencies
        run: |
          cd kokkai-transcriber
          if [ "${{ matrix.session.chamber }}" = "sangiin" ]; then
            pip install -e '.[browser]'
            python -m playwright install --with-deps chromium
          else
            pip install -e .
          fi
      
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run pipeline
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          cd kokkai-transcriber
          python -m src.pipeline \
            --chamber ${{ matrix.session.chamber }} \
            --session-id ${{ matrix.session.sid }} \
            --no-push
      
      - name: Upload session data
        uses: actions/upload-artifact@v4
        with:
          name: session-${{ matrix.session.chamber }}-${{ matrix.session.sid }}
          path: data/
          retention-days: 1

  finalize:
    needs: ingest
    if: always() && (needs.ingest.result == 'success' || needs.ingest.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Configure git identity
        run: |
          git config --global user.name "kokkaidb-bot"
          git config --global user.email "kokkaidb-bot@users.noreply.github.com"
      
      - name: Download all session data
        uses: actions/download-artifact@v4
        with:
          pattern: session-*
          path: data/
          merge-multiple: true
      
      - name: Commit and push
        id: commit
        run: |
          git add data/
          if git diff --cached --quiet --exit-code; then
            echo "No data changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: batch ingestion ($(date +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "pushed (attempt $i)"
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected; pull --rebase + retry ($i/5)"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 2))
          done
          echo "::error::push failed after 5 retries"
          exit 1
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

  build:
    needs: [discovery, finalize]
    # finalize が成功したか、あるいは finalize がスキップされた（新規セッションなし）が build は常にチェックする
    # ただし cancelled は避ける
    if: always() && !cancelled() && needs.discovery.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5

      - name: Skip build if no new data commit
        id: guard
        run: |
          # 直近5コミット内に "data: ... batch" または "data: batch ingestion" の commit があれば build を実行
          if git log -5 --format='%s' | grep -qE '(data: (shugiin|sangiin) batch|data: batch ingestion)'; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "New data detected — proceeding with build"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No new data commits — skipping build"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.built == 'true'
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.built == 'true'
        working-directory: site
        run: npm ci

      - name: Validate data referential integrity
        if: steps.guard.outputs.built == 'true'
        working-directory: site
        continue-on-error: true
        run: npm run validate:data

      - name: Build Astro site
        if: steps.guard.outputs.built == 'true'
        working-directory: site
        run: npm run build

      - name: Upload artifact
        if: steps.guard.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
