name: Batch ingest sessions

on:
  schedule:
    # 毎時 15 分に起動（衆議院TVの反映タイミングをずらす）
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: '開始日 (YYYY-MM-DD)。省略時は7日前'
        required: false
        default: ''
      chamber:
        description: '対象の院'
        required: false
        default: 'shugiin'
        type: choice
        options:
          - shugiin
          - sangiin
      workers:
        description: '並列数'
        required: false
        default: '4'

# 同一ワークフローは1つしか走らせない（構造的多重排除）
concurrency:
  group: kokkai-batch
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      has_new_data: ${{ steps.commit.outputs.has_new_data }}
    defaults:
      run:
        working-directory: kokkai-transcriber
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "kokkaidb-bot"
          git config --global user.email "kokkaidb-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kokkai-transcriber/pyproject.toml

      - name: Resolve date range
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.since }}" ]; then
            SINCE="${{ github.event.inputs.since }}"
          else
            SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          fi
          UNTIL=$(date -u +%Y-%m-%d)
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"
          echo "Range: $SINCE .. $UNTIL"

      # ここまでで新規セッションの有無だけ判定する。requests + BS4 だけ先に入れて
      # dry-run を走らせ、対象ゼロなら ffmpeg / 全依存インストール / laws 更新 /
      # 本処理すべてスキップして早期 exit する。スケジュール起動で新規がない
      # ことが多いので、この短絡で runner 時間を節約する。
      - name: Install scraping deps only
        run: pip install requests beautifulsoup4 pydantic python-dotenv

      - name: Probe for new sessions (dry-run)
        id: probe
        env:
          CHAMBER: ${{ github.event.inputs.chamber || 'shugiin' }}
        run: |
          LOG=$(python -m src.batch \
            --chamber "$CHAMBER" \
            --since "${{ steps.dates.outputs.since }}" \
            --until "${{ steps.dates.outputs.until }}" \
            --dry-run 2>&1)
          echo "$LOG"
          TOTAL=$(echo "$LOG" | grep -oP 'Total sessions to process: \K\d+' | tail -1)
          echo "total=${TOTAL:-0}" >> "$GITHUB_OUTPUT"
          if [ "${TOTAL:-0}" = "0" ]; then
            echo "No new sessions — skipping full pipeline"
          fi

      - name: Install ffmpeg
        if: steps.probe.outputs.total != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install full pipeline dependencies
        if: steps.probe.outputs.total != '0'
        run: pip install -e .

      - name: Refresh laws_compact.txt
        if: steps.probe.outputs.total != '0'
        env:
          # 当該国会の session 番号
          DIET_SESSION: '221'
        run: |
          python -m src.laws_builder --sessions "$DIET_SESSION" || \
            echo "laws_builder failed (non-fatal, pipeline will skip law tagging)"

      - name: Run batch
        if: steps.probe.outputs.total != '0'
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CHAMBER: ${{ github.event.inputs.chamber || 'shugiin' }}
          WORKERS: ${{ github.event.inputs.workers || '4' }}
        run: |
          python -m src.batch \
            --chamber "$CHAMBER" \
            --since "${{ steps.dates.outputs.since }}" \
            --until "${{ steps.dates.outputs.until }}" \
            --workers "$WORKERS" \
            --no-push

      # batch.py の commit/push はスキップし、workflow 側で一元管理する。
      # GITHUB_TOKEN で push すると他 workflow を発火しないため、
      # 後続の build/deploy ジョブでサイト更新まで完結させる。
      - name: Commit data/
        id: commit
        if: steps.probe.outputs.total != '0'
        working-directory: ${{ github.workspace }}
        run: |
          git add data/
          if git diff --cached --quiet --exit-code; then
            echo "No data changes to commit"
            echo "has_new_data=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: batch ${{ steps.dates.outputs.since }}〜${{ steps.dates.outputs.until }}"
            git push origin main
            echo "has_new_data=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: ingest
    if: needs.ingest.outputs.has_new_data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # ingest が push した最新コミットを取得

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro site (includes Pagefind via postbuild)
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
