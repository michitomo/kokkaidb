name: Batch ingest sessions

on:
  schedule:
    # 毎時 15 分に起動。matrix で衆議院・参議院を並列に走らせる。
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: '開始日 (YYYY-MM-DD)。省略時は7日前'
        required: false
        default: ''
      chamber:
        description: '対象の院 (両方 / 個別)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - shugiin
          - sangiin
      workers:
        description: '並列数'
        required: false
        default: '4'

# 同一 chamber の重複起動を構造的に排除する。chamber 間は並列実行を許可。
# ワークフロー全体の concurrency は外し、matrix 各 instance に持たせる。

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  setup:
    # 走らせる chamber 集合を決定する。
    # - cron / dispatch=both → ["shugiin", "sangiin"]
    # - dispatch=shugiin or sangiin → 単独
    runs-on: ubuntu-latest
    outputs:
      chambers: ${{ steps.chambers.outputs.chambers }}
    steps:
      - id: chambers
        env:
          CH: ${{ github.event.inputs.chamber }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$CH" ] && [ "$CH" != "both" ]; then
            echo "chambers=[\"$CH\"]" >> "$GITHUB_OUTPUT"
            echo "Selected chamber: $CH"
          else
            echo 'chambers=["shugiin","sangiin"]' >> "$GITHUB_OUTPUT"
            echo "Selected chambers: shugiin + sangiin"
          fi

  ingest:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # 片方の chamber が落ちてももう片方は走らせ切る。
      fail-fast: false
      matrix:
        chamber: ${{ fromJSON(needs.setup.outputs.chambers) }}
    # chamber 単位の concurrency: 同一 chamber の前回ランが走っていれば
    # 待つが、別 chamber は並列に走らせられる。
    concurrency:
      group: kokkai-batch-${{ matrix.chamber }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: kokkai-transcriber
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "kokkaidb-bot"
          git config --global user.email "kokkaidb-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kokkai-transcriber/pyproject.toml

      - name: Resolve date range
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.since }}" ]; then
            SINCE="${{ github.event.inputs.since }}"
          else
            SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          fi
          UNTIL=$(date -u +%Y-%m-%d)
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"
          echo "Range: $SINCE .. $UNTIL"

      # pip install は全依存入れる必要がある: batch.py → pipeline.py →
      # transcriber/structurer が openai 等を import するため。pip cache が
      # 効くので概ね10〜20秒。ffmpeg (apt) は本処理時のみ入れて節約する。
      # 参議院の場合は [browser] extras と Chromium が要る
      # (POST keyword_search.php が F5 ASM Bot Defense で保護されているため)。
      - name: Install pipeline dependencies
        env:
          CHAMBER: ${{ matrix.chamber }}
        run: |
          if [ "$CHAMBER" = "sangiin" ]; then
            pip install -e '.[browser]'
            python -m playwright install --with-deps chromium
          else
            pip install -e .
          fi

      - name: Probe for new sessions (dry-run)
        id: probe
        env:
          CHAMBER: ${{ matrix.chamber }}
        run: |
          set +e
          LOG=$(python -m src.batch \
            --chamber "$CHAMBER" \
            --since "${{ steps.dates.outputs.since }}" \
            --until "${{ steps.dates.outputs.until }}" \
            --dry-run 2>&1)
          EXIT=$?
          echo "$LOG"
          if [ $EXIT -ne 0 ]; then
            echo "::error::batch dry-run exited with $EXIT for chamber=$CHAMBER"
            exit $EXIT
          fi
          TOTAL=$(echo "$LOG" | grep -oP 'Total sessions to process: \K\d+' | tail -1)
          echo "total=${TOTAL:-0}" >> "$GITHUB_OUTPUT"
          if [ "${TOTAL:-0}" = "0" ]; then
            echo "No new sessions for $CHAMBER — skipping full pipeline"
          fi

      - name: Install ffmpeg
        if: steps.probe.outputs.total != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Refresh laws_compact.txt
        if: steps.probe.outputs.total != '0'
        env:
          # 当該国会の session 番号
          DIET_SESSION: '221'
        run: |
          python -m src.laws_builder --sessions "$DIET_SESSION" || \
            echo "laws_builder failed (non-fatal, pipeline will skip law tagging)"

      - name: Run batch
        if: steps.probe.outputs.total != '0'
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CHAMBER: ${{ matrix.chamber }}
          WORKERS: ${{ github.event.inputs.workers || '4' }}
        run: |
          python -m src.batch \
            --chamber "$CHAMBER" \
            --since "${{ steps.dates.outputs.since }}" \
            --until "${{ steps.dates.outputs.until }}" \
            --workers "$WORKERS" \
            --no-push

      # batch.py の commit/push はスキップし、workflow 側で一元管理する。
      # 並列に走る別 chamber が同時に push する競合に備え、push 失敗時は
      # `git pull --rebase` で取り込んでから retry する (5回まで指数バックオフ)。
      # 衆議院は data/shugiin/、参議院は data/sangiin/ しか触らないのでファイル
      # 単位の競合は理論上発生しない。git ref レベルの fast-forward 競合だけ
      # rebase で解消する。
      - name: Commit data/
        id: commit
        if: steps.probe.outputs.total != '0'
        working-directory: ${{ github.workspace }}
        env:
          CHAMBER: ${{ matrix.chamber }}
        run: |
          git add data/
          if git diff --cached --quiet --exit-code; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: $CHAMBER batch ${{ steps.dates.outputs.since }}〜${{ steps.dates.outputs.until }}"
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "pushed (attempt $i)"
              exit 0
            fi
            echo "push rejected; pull --rebase + retry ($i/5)"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 2))
          done
          echo "::error::push failed after 5 retries"
          exit 1

  build:
    # ingest 両 chamber の完了を待つ (success/failure いずれも next へ)。
    # 何も新規 commit が無かった場合は build をスキップする。
    needs: ingest
    if: always() && needs.ingest.result != 'cancelled' && needs.ingest.result != 'skipped'
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5

      - name: Skip build if no new data commit
        id: guard
        run: |
          # 直近5コミット内に "data: ... batch ..." の commit があれば build を実行
          if git log -5 --format='%s' | grep -qE '^data: (shugiin|sangiin) batch'; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "New data detected — proceeding with build"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No new data commits — skipping build"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.built == 'true'
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.built == 'true'
        working-directory: site
        run: npm ci

      - name: Validate data referential integrity (non-blocking until reprocess)
        if: steps.guard.outputs.built == 'true'
        working-directory: site
        continue-on-error: true
        run: npm run validate:data

      - name: Build Astro site (includes Pagefind via postbuild)
        if: steps.guard.outputs.built == 'true'
        working-directory: site
        run: npm run build

      - name: Upload artifact
        if: steps.guard.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
