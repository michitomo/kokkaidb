name: Batch ingest sessions

on:
  schedule:
    # 毎時 15 分に起動。
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: '開始日 (YYYY-MM-DD)。省略時は今日 (JST) のみ'
        required: false
        default: ''
      chamber:
        description: '対象の院 (both / shugiin / sangiin)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - shugiin
          - sangiin

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.probe.outputs.sessions }}
      total: ${{ steps.probe.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kokkai-transcriber/pyproject.toml

      # インストール前に日付を確定し、Playwright が必要か判定する。
      # cron: JST 今日のみチェック → GET 軽量経路 → Playwright 不要。
      # workflow_dispatch で過去日付を指定した場合のみ Playwright 経路。
      - name: Resolve dates
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.since }}" ]; then
            SINCE="${{ github.event.inputs.since }}"
          else
            SINCE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          if [ "$SINCE" = "$TODAY_JST" ]; then
            NEEDS_BROWSER=false
          else
            NEEDS_BROWSER=true
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "needs_browser=$NEEDS_BROWSER" >> "$GITHUB_OUTPUT"

      - name: Cache .venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: kokkai-transcriber/.venv
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('kokkai-transcriber/pyproject.toml') }}-${{ steps.dates.outputs.needs_browser }}

      - name: Install discovery dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          cd kokkai-transcriber
          python -m venv .venv
          if [ "${{ steps.dates.outputs.needs_browser }}" = "true" ]; then
            .venv/bin/pip install -e '.[browser]'
          else
            .venv/bin/pip install -e .
          fi

      - name: Cache Playwright browsers
        if: steps.dates.outputs.needs_browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('kokkai-transcriber/pyproject.toml') }}

      - name: Install Playwright Chromium
        if: steps.dates.outputs.needs_browser == 'true'
        working-directory: kokkai-transcriber
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Probe for new sessions
        id: probe
        working-directory: kokkai-transcriber
        run: |
          CH="${{ github.event.inputs.chamber }}"
          if [ "$CH" = "shugiin" ]; then
            ARGS="--chamber shugiin"
          elif [ "$CH" = "sangiin" ]; then
            ARGS="--chamber sangiin"
          else
            ARGS="--chamber shugiin --chamber sangiin"
          fi
          JSON=$(./.venv/bin/python -m src.batch $ARGS --since "${{ steps.dates.outputs.since }}" --dry-run --json)
          echo "sessions=$JSON" >> "$GITHUB_OUTPUT"
          TOTAL=$(echo "$JSON" | jq 'length')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          
          # サマリー出力
          echo "### Discovered Sessions ($TOTAL)" >> $GITHUB_STEP_SUMMARY
          echo "| Chamber | Session ID | Date |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------------|------|" >> $GITHUB_STEP_SUMMARY
          echo "$JSON" | jq -r '.[] | "| \(.chamber) | \(.sid) | \(.date) |"' >> $GITHUB_STEP_SUMMARY

      - name: Refresh laws
        if: steps.probe.outputs.total != '0'
        working-directory: kokkai-transcriber
        run: ./.venv/bin/python -m src.laws_builder --sessions "221"

      - name: Upload laws
        if: steps.probe.outputs.total != '0'
        uses: actions/upload-artifact@v4
        with:
          name: laws-data
          path: data/laws/
          retention-days: 1

  ingest:
    needs: discovery
    if: needs.discovery.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs.discovery.outputs.sessions) }}
    name: ingest (${{ matrix.session.chamber }}-${{ matrix.session.sid }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kokkai-transcriber/pyproject.toml
      
      - name: Download laws
        uses: actions/download-artifact@v4
        with:
          name: laws-data
          path: data/laws/
      
      - name: Cache .venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: kokkai-transcriber/.venv
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('kokkai-transcriber/pyproject.toml') }}-${{ matrix.session.chamber }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          cd kokkai-transcriber
          python -m venv .venv
          if [ "${{ matrix.session.chamber }}" = "sangiin" ]; then
            .venv/bin/pip install -e '.[browser]'
          else
            .venv/bin/pip install -e .
          fi

      - name: Cache Playwright browsers
        if: matrix.session.chamber == 'sangiin'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('kokkai-transcriber/pyproject.toml') }}

      - name: Install Playwright Chromium
        if: matrix.session.chamber == 'sangiin'
        working-directory: kokkai-transcriber
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Run pipeline
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          SESSION_CHAMBER: ${{ matrix.session.chamber }}
          SESSION_SID: ${{ matrix.session.sid }}
        working-directory: kokkai-transcriber
        run: ./.venv/bin/python -m src.pipeline --chamber "$SESSION_CHAMBER" --session-id "$SESSION_SID" --no-push
      
      - name: Upload session data
        uses: actions/upload-artifact@v4
        with:
          name: session-${{ matrix.session.chamber }}-${{ matrix.session.sid }}
          path: data/
          retention-days: 1

  finalize:
    needs: ingest
    if: always() && (needs.ingest.result == 'success' || needs.ingest.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Configure git identity
        run: |
          git config --global user.name "kokkaidb-bot"
          git config --global user.email "kokkaidb-bot@users.noreply.github.com"
      
      - name: Download all session data
        uses: actions/download-artifact@v4
        with:
          pattern: session-*
          path: data/
          merge-multiple: true
      
      - name: Commit and push
        id: commit
        run: |
          git add data/
          if git diff --cached --quiet --exit-code; then
            echo "No data changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: batch ingestion ($(date +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "pushed (attempt $i)"
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected; pull --rebase + retry ($i/5)"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 2))
          done
          echo "::error::push failed after 5 retries"
          exit 1
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

  build:
    needs: [finalize]
    # finalize が今回の実行でコミットを作成した場合のみ build を実行する。
    # finalize がスキップされた（新規セッションなし）場合は committed が空になるので build もスキップ。
    if: always() && needs.finalize.outputs.committed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kokkai-transcriber/pyproject.toml

      - name: Install search-index dependencies
        run: pip install sudachipy sudachidict-core

      - name: Build search index
        working-directory: kokkai-transcriber
        run: python -m src.build_search_index

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Validate data referential integrity
        working-directory: site
        continue-on-error: true
        run: npm run validate:data

      - name: Build Astro site
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
