[project]
name = "kokkai-transcriber"
version = "0.1.0"
description = "衆議院TV・参議院TVの音声を文字起こし・構造化するパイプライン"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openai>=1.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
eval = [
    "pyyaml>=6.0",
]
# 参議院の過去日付検索で WAF (F5 ASM) を通すために必要。
# 衆議院のみを処理する場合は不要。
# 利用時は別途 `python -m playwright install --with-deps chromium` も実行する。
browser = [
    "playwright>=1.49",
    "playwright-stealth>=2.0",
]

[project.scripts]
kokkai-pipeline = "src.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring external services (deselect with '-m \"not integration\"')",
]
