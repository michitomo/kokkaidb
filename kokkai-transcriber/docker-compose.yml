services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      # リポジトリルート全体をマウント（git操作・data/書き込みのため）
      - ..:/repo
      # git push 用に SSH 鍵をマウント（読み取り専用）
      - ~/.ssh:/root/.ssh:ro
    working_dir: /repo/kokkai-transcriber

    # デフォルト: 未処理の全セッションを4並列で処理してpush
    # CI (GitHub Actions) が data/ push を検知してサイトを自動ビルド+デプロイ
    command: >
      python -m src.batch
      --chamber shugiin
      --since 2026-02-01
      --workers 4

  # 特定セッションを手動処理する場合:
  #   docker compose run --rm transcriber python -m src.pipeline --chamber shugiin --session-id 56149 --no-push
  #
  # ドライラン（対象セッション一覧のみ表示）:
  #   docker compose run --rm transcriber python -m src.batch --chamber shugiin --since 2026-02-01 --dry-run
  #
  # push なしで処理（ローカル確認用）:
  #   docker compose run --rm transcriber python -m src.batch --chamber shugiin --since 2026-02-01 --workers 4 --no-push
